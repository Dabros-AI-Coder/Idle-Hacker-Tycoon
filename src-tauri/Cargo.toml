[package]
name = "idle-hacker-tycoon"
version = "0.5.0"
description = "Idle Hacker Tycoon - Tauri Desktop"
authors = ["Dabros-AI-Coder"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
